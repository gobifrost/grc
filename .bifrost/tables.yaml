  e68e61dc-dcae-4c80-93e3-88f7ff4fac54:
    id: e68e61dc-dcae-4c80-93e3-88f7ff4fac54
    name: grc-policy-acceptances
    description: Append-only policy campaign acceptance events.
    schema:
      columns:
      - name: organization_id
        type: string
        required: true
        description: Customer organization that owns the acceptance event.
      - name: campaign_id
        type: string
        required: true
      - name: assignment_id
        type: string
      - name: actor_id
        type: string
        required: true
      - name: actor_email
        type: string
      - name: actor_display_name
        type: string
      - name: accepted_policy_ids_json
        type: string
      - name: accepted_policy_versions_json
        type: string
      - name: status
        type: string
        enum: [accepted, revoked, superseded]
        default: accepted
      - name: accepted_at
        type: datetime
        required: true
      - name: revoked_at
        type: datetime
      - name: superseded_by
        type: string
      - name: source_system
        type: string
      - name: source_id
        type: string
      - name: metadata_json
        type: string
    policies:
    - name: platform_admin_bypass
      description: Platform administrators may recover and administer policy acceptance events.
      actions: [read, create, update, delete]
      when:
        user: is_platform_admin
    - name: grc_tenant_read
      description: GRC roles read acceptance events for their visible organization context.
      actions: [read]
      when:
        and:
        - or:
          - args: [GRC Auditor]
            call: has_role
          - args: [GRC Contributor]
            call: has_role
          - args: [GRC Administrator]
            call: has_role
        - or:
          - user: is_provider_org
          - eq:
            - row: organization_id
            - user: organization_id
    - name: grc_recipient_own_acceptance_read
      description: Policy recipients may read only their own acceptance events in their customer organization.
      actions: [read]
      when:
        and:
        - args: [GRC Viewer]
          call: has_role
        - eq:
          - row: organization_id
          - user: organization_id
        - eq:
          - row: actor_id
          - user: user_id
  eecb60eb-8b85-475f-b24b-2bf6654571cb:
    id: eecb60eb-8b85-475f-b24b-2bf6654571cb
    name: grc-assessments
    description: GRC compliance assessments for an organization
    schema:
      columns:
      - name: organization_id
        type: string
        description: Bifrost organization this GRC row belongs to. NULL = global.
      - name: framework_id
        type: string
        required: true
      - name: name
        type: string
        required: true
        description: Assessment name
      - name: applied_organizations
        type: array
        description: Org IDs this assessment applies to. null = all orgs (perpetual);
          [] = none yet; [a,b,c] = specific
      - name: excluded_organizations
        type: array
        description: Customer org IDs explicitly outside this assessment's applicability.
      - enum:
        - draft
        - in_progress
        - completed
        - reviewed
        name: status
        type: string
        default: draft
      - name: progress_percentage
        type: number
        default: 0
      - name: started_at
        type: datetime
      - name: completed_at
        type: datetime
      - name: assigned_to
        type: string
        description: Assignee name or ID
    policies:
    - name: platform_admin_bypass
      description: Platform administrators may recover and administer all GRC data.
