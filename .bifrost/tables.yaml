          - {call: has_role, args: [GRC Contributor]}
          - {call: has_role, args: [GRC Administrator]}
        - or:
          - {user: is_provider_org}
          - {eq: [{row: organization_id}, {user: organization_id}]}
          - {is_null: {row: organization_id}}
    - name: grc_fact_create
      actions: [create]
      when:
        and:
        - or:
          - {call: has_role, args: [GRC Contributor]}
          - {call: has_role, args: [GRC Administrator]}
        - or:
          - {user: is_provider_org}
          - {eq: [{row: organization_id}, {user: organization_id}]}
    - name: grc_fact_update_delete
      actions: [update]
      when:
        and:
        - or:
