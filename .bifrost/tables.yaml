      - {name: excluded_organizations, type: array, description: "Reserved applicability exclusions; scoped fact groups currently materialize explicit inclusions."}
      - {name: scope_id, type: string, description: "Stable logical scope ID shared by every materialized row in a Some scope."}
      - {name: scope_kind, type: string, default: one, enum: [one, some, all]}
      - {name: scope_size, type: number, description: "Logical audience size used for deterministic narrowest-scope precedence; null for All."}
