      actions: [create]
      when:
        and:
        - or:
          - {args: [GRC Contributor], call: has_role}
          - {args: [GRC Administrator], call: has_role}
        - or:
          - {user: is_provider_org}
          - eq: [{row: organization_id}, {user: organization_id}]
    - name: grc_template_update
      description: Contributors and administrators update templates in their own organization; provider roles may update shared templates.
      actions: [update]
      when:
        and:
        - or:
          - {args: [GRC Contributor], call: has_role}
          - {args: [GRC Administrator], call: has_role}
        - or:
          - {user: is_provider_org}
          - {eq: [{row: organization_id}, {user: organization_id}]}
    - name: grc_template_delete
      description: Provider-org GRC contributors and administrators may hard-delete routine records; customers must archive them.
      actions: [delete]
      when:
        and:
        - or:
          - args: [GRC Contributor]
            call: has_role
          - args: [GRC Administrator]
            call: has_role
        - user: is_provider_org
