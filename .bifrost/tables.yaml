tables:
  38250b4d-6231-4702-99a6-09e7d18b8e29:
    id: 38250b4d-6231-4702-99a6-09e7d18b8e29
    name: grc-assessment-controls
    description: Per-control assessment results within an assessment
    schema:
      columns:
      - name: organization_id
        type: string
        description: Provider organization that owns this assessment result.
      - name: assessment_id
        type: string
        required: true
      - name: control_id
        type: string
        required: true
      - enum:
        - compliant
        - partially_compliant
        - non_compliant
        - not_assessed
        - not_applicable
        name: status
        type: string
        default: not_assessed
      - name: implementation_percentage
        type: number
        default: 0
      - name: notes
        type: string
      - name: assessed_by
        type: string
      - name: assessed_at
        type: datetime
    policies:
    - name: platform_admin_bypass
      description: Platform administrators may recover and administer all GRC data.
      actions:
      - read
      - create
      - update
      - delete
      when:
        user: is_platform_admin
    - name: grc_tenant_read
      description: GRC roles read all clients from Platform Org; other organizations
        read their own and shared global rows.
      actions:
      - read
      when:
        and:
        - or:
          - args:
            - GRC Auditor
            call: has_role
          - args:
            - GRC Contributor
            call: has_role
          - args:
            - GRC Administrator
            call: has_role
        - or:
          - user: is_provider_org
          - eq:
            - row: organization_id
            - user: organization_id
          - is_null:
              row: organization_id
    - name: grc_tenant_create_delete
      description: GRC contributors and administrators create and delete all clients
        from Platform Org; other organizations create and delete only their own rows.
      actions:
      - create
      when:
        and:
        - or:
          - args:
            - GRC Contributor
            call: has_role
          - args:
            - GRC Administrator
            call: has_role
        - or:
          - user: is_provider_org
          - eq:
            - row: organization_id
            - user: organization_id
    - name: grc_tenant_delete
      description: Provider-org GRC contributors and administrators may hard-delete routine records; customers must archive them.
      actions:
      - delete
      when:
        and:
        - or:
          - args: [GRC Contributor]
            call: has_role
          - args: [GRC Administrator]
            call: has_role
        - user: is_provider_org
    - name: grc_tenant_update
      description: Contributors and administrators update rows in their own organization; provider roles may update any customer row.
      actions:
      - update
      when:
        and:
        - or:
          - args:
            - GRC Contributor
            call: has_role
          - args:
            - GRC Administrator
            call: has_role
        - or:
          - user: is_provider_org
          - eq:
            - row: organization_id
            - user: organization_id
  27a48006-9937-40c7-a06b-aefc7b5a8f6a:
    id: 27a48006-9937-40c7-a06b-aefc7b5a8f6a
    name: grc-policy-campaigns
    description: Generic policy campaign records for integration-driven acknowledgement or review journeys.
    schema:
      columns:
      - name: organization_id
        type: string
        required: true
        description: Customer organization that owns the campaign.
      - name: idempotency_key
        type: string
        required: true
        description: Stable caller-supplied key used to create or return the same campaign.
      - name: request_fingerprint
        type: string
        description: Canonical fingerprint used to detect changed idempotent requests.
      - name: title
        type: string
        required: true
      - name: description
        type: string
      - name: status
        type: string
        enum: [draft, active, closed, archived]
        default: active
      - name: policy_ids_json
        type: string
        required: true
        description: JSON array of explicit policy ids included in this campaign.
      - name: policy_versions_json
        type: string
        description: JSON object of policy id to policy version captured when the campaign was created.
      - name: audience_count
        type: integer
        default: 0
      - name: audience_json
        type: string
        description: JSON array of deduplicated campaign audience actors.
      - name: due_date
        type: date
      - name: link_url
        type: string
      - name: created_by_actor_id
        type: string
      - name: created_by_actor_email
        type: string
      - name: created_by_actor_display_name
        type: string
      - name: metadata_json
        type: string
    policies:
    - name: platform_admin_bypass
      description: Platform administrators may recover and administer policy campaign records.
      actions: [read, create, update, delete]
      when:
        user: is_platform_admin
    - name: grc_tenant_read
      description: GRC roles read campaigns for their visible organization context.
      actions: [read]
      when:
        and:
        - or:
          - args: [GRC Auditor]
            call: has_role
          - args: [GRC Contributor]
            call: has_role
          - args: [GRC Administrator]
            call: has_role
        - or:
          - user: is_provider_org
          - eq:
            - row: organization_id
            - user: organization_id
