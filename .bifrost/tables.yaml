  0ee83b1d-afa1-4a47-8e76-6c561297f82e:
    id: 0ee83b1d-afa1-4a47-8e76-6c561297f82e
    name: grc-findings
    description: Durable manual or agent observations that do not already have an authoritative assessment or questionnaire record.
    schema:
      columns:
      - name: organization_id
        type: string
        required: true
        description: Customer organization affected by the observation.
      - name: title
        type: string
        required: true
      - name: body
        type: string
        description: Concise description of the observed condition and why it matters.
      - name: severity
        type: string
        enum: [low, medium, high, critical]
        default: medium
      - name: status
        type: string
        enum: [open, resolved, accepted, dismissed]
        default: open
      - name: owner
        type: string
      - name: target_date
        type: date
      - name: source_system
        type: string
        description: System or agent that observed the condition.
      - name: source_id
        type: string
        description: Stable source identifier used to prevent duplicate observations.
      - name: source_url
        type: string
      - name: related_record_type
        type: string
        description: Optional authoritative GRC record type associated with the observation.
      - name: related_record_id
        type: string
      - name: resolution_notes
        type: string
      - name: resolved_at
        type: datetime
      - name: resolved_by
        type: string
    policies:
    - name: platform_admin_bypass
      description: Platform administrators may recover and administer all GRC data.
      actions: [read, create, update, delete]
      when:
        user: is_platform_admin
    - name: grc_tenant_read
      description: GRC roles read customer observations available to their organization context.
      actions: [read]
      when:
        and:
        - or:
          - args: [GRC Auditor]
            call: has_role
          - args: [GRC Contributor]
            call: has_role
          - args: [GRC Administrator]
            call: has_role
        - or:
          - user: is_provider_org
          - eq:
            - row: organization_id
            - user: organization_id
