  28db201c-6694-4c6d-86e2-08f67ef79da8:
    id: 28db201c-6694-4c6d-86e2-08f67ef79da8
    name: grc-evidence
    description: Evidence artifacts for compliance assessments
    schema:
      columns:
      - name: organization_id
        type: string
        description: Provider organization that owns this reusable evidence.
      - name: applied_organizations
        type: array
        description: Customer org IDs this evidence applies to. null means all current and future customers.
      - name: excluded_organizations
        type: array
        description: Customer org IDs excluded from applicability.
      - name: assessment_id
        type: string
        description: Optional link to assessment
      - name: control_id
        type: string
        description: Optional link to control
      - name: name
        type: string
        required: true
        description: Evidence name
      - enum:
        - document
        - url
        - screenshot
        - note
        name: type
        type: string
        required: true
      - name: url
        type: string
        description: URL for link-type evidence
      - name: file_path
        type: string
        description: Bifrost storage path for uploaded files
      - name: notes
        type: string
      - name: notes_markdown
        type: string
        description: Markdown-formatted evidence notes.
      - name: urls_json
        type: string
        description: JSON array of supporting URLs.
      - name: attachments_json
        type: string
        description: JSON array of managed file attachments.
      - name: provenance_json
        type: string
        description: JSON object describing source system and collection provenance.
      - name: tags
        type: array
        description: Search and classification tags.
      - name: review_status
        type: string
        enum: [draft, needs_review, approved, rejected]
        default: draft
      - name: last_reviewed_at
        type: datetime
      - name: review_due
        type: date
        description: Date this evidence should be reviewed or recollected.
      - name: review_frequency_days
        type: integer
        default: 365
      - name: uploaded_by
        type: string
    policies:
    - name: platform_admin_bypass
      description: Platform administrators may recover and administer all GRC data.
      actions:
      - read
      - create
      - update
      - delete
      when:
        user: is_platform_admin
